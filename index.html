        function getCompanyTenderStats(company) {
            if (!company) {
                return { completed: 12, active: 4, lostPrice: 3, techDisqualified: 1, total: 20, winRate: 80 };
            }
            if (company.pastTenders && company.pastTenders.length > 0) {
                const wonCount = company.pastTenders.filter(t => t.outcome === 'Won' || t.status === 'Won').length;
                const completed = Math.max(wonCount, 2);
                const active = company.activeContracts || 2;
                const techDisqualified = company.status === 'Debarred' ? 6 : (company.status === 'Flagged for Audit' ? 3 : 1);
                const lostPrice = Math.max(company.pastTenders.length - wonCount, 2);
                const total = completed + active + lostPrice + techDisqualified;
                const winRate = Math.round(((completed + active) / total) * 100);
                return { completed, active, lostPrice, techDisqualified, total, winRate };
            }
            if (company.status === 'Debarred') {
                return { completed: 2, active: 1, lostPrice: 5, techDisqualified: 7, total: 15, winRate: 20 };
            } else if (company.status === 'Flagged for Audit') {
                return { completed: 5, active: 3, lostPrice: 4, techDisqualified: 3, total: 15, winRate: 53 };
            } else {
                const completed = company.turnoverCr > 15 ? 16 : 11;
                const active = company.turnoverCr > 15 ? 5 : 3;
                const lostPrice = 3;
                const techDisqualified = 1;
                const total = completed + active + lostPrice + techDisqualified;
                const winRate = Math.round(((completed + active) / total) * 100);
                return { completed, active, lostPrice, techDisqualified, total, winRate };
            }
        }

        function CompanyPieChart({ company }) {
            const stats = useMemo(() => getCompanyTenderStats(company), [company]);
            const [hoveredIdx, setHoveredIdx] = useState(null);

            const categories = [
                { label: 'Awarded & Completed', count: stats.completed, color: '#0f766e' },
                { label: 'Active in Execution', count: stats.active, color: '#2563eb' },
                { label: 'Lost on Price (L2/L3)', count: stats.lostPrice, color: '#f59e0b' },
                { label: 'Technical Disqualification', count: stats.techDisqualified, color: '#ef4444' }
            ];

            const total = stats.total || 1;
            const radius = 58;
            const circumference = 2 * Math.PI * radius;

            let accumulatedPercent = 0;
            const slices = categories.map((cat, idx) => {
                const percent = cat.count / total;
                const strokeDash = percent * circumference;
                const strokeOffset = accumulatedPercent * circumference;
                accumulatedPercent += percent;
                return {
                    ...cat,
                    percent: Math.round(percent * 100),
                    strokeDash,
                    strokeOffset,
                    idx
                };
            });

            return h('div', { className: 'pie-container' },
                h('div', { style: { position: 'relative', width: 190, height: 190, display: 'flex', alignItems: 'center', justifyContent: 'center' } },
                    h('svg', { width: 190, height: 190, viewBox: '0 0 190 190', style: { transform: 'rotate(-90deg)' } },
                        h('circle', {
                            cx: 95,
                            cy: 95,
                            r: radius,
                            fill: 'none',
                            stroke: 'color-mix(in srgb, var(--ln) 70%, transparent)',
                            strokeWidth: 28
                        }),
                        slices.map(slice =>
                            h('circle', {
                                key: slice.label,
                                cx: 95,
                                cy: 95,
                                r: radius,
                                fill: 'none',
                                stroke: slice.color,
                                strokeWidth: hoveredIdx === slice.idx ? 34 : 28,
                                strokeDasharray: `${slice.strokeDash} ${circumference}`,
                                strokeDashoffset: -slice.strokeOffset,
                                style: {
                                    transition: 'all 0.2s ease',
                                    opacity: hoveredIdx !== null && hoveredIdx !== slice.idx ? 0.45 : 1,
                                    cursor: 'pointer'
                                },
                                onMouseEnter: () => setHoveredIdx(slice.idx),
                                onMouseLeave: () => setHoveredIdx(null)
                            })
                        )
                    ),
                    h('div', {
                        style: {
                            position: 'absolute',
                            textAlign: 'center',
                            pointerEvents: 'none',
                            display: 'flex',
                            flexDirection: 'column',
                            alignItems: 'center'
                        }
                    },
                        hoveredIdx !== null ? [
                            h('span', { key: 'count', style: { fontSize: 20, fontWeight: 800, color: slices[hoveredIdx].color } },
                                `${slices[hoveredIdx].percent}%`
                            ),
                            h('span', { key: 'lbl', style: { fontSize: 10, color: 'var(--mu)', maxWidth: 75, lineHeight: 1.1 } },
                                slices[hoveredIdx].label.split(' ')[0]
                            )
                        ] : [
                            h('span', { key: 'total', style: { fontSize: 22, fontWeight: 800, color: 'var(--ink)' } },
                                stats.winRate + '%'
                            ),
                            h('span', { key: 'win', style: { fontSize: 10, color: 'var(--mu)', fontWeight: 600 } },
                                'Win Rate'
                            )
                        ]
                    )
                ),

                h('div', { className: 'pie-legend-list' },
                    slices.map(s =>
                        h('div', {
                            key: s.label,
                            className: 'pie-legend-row',
                            style: {
                                borderColor: hoveredIdx === s.idx ? s.color : 'var(--ln)',
                                background: hoveredIdx === s.idx ? 'color-mix(in srgb, ' + s.color + ' 12%, var(--sf))' : undefined,
                                cursor: 'pointer',
                                transition: 'all 0.15s ease'
                            },
                            onMouseEnter: () => setHoveredIdx(s.idx),
                            onMouseLeave: () => setHoveredIdx(null)
                        },
                            h('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
                                h('span', {
                                    style: {
                                        width: 10,
                                        height: 10,
                                        borderRadius: '50%',
                                        background: s.color,
                                        display: 'inline-block'
                                    }
                                }),
                                h('span', { style: { fontWeight: 500 } }, s.label)
                            ),
                            h('div', { style: { display: 'flex', gap: 6, alignItems: 'center' } },
                                h('b', { style: { color: s.color } }, `${s.count}`),
                                h('span', { className: 'm', style: { fontSize: 11 } }, `(${s.percent}%)`)
                            )
                        )
                    )
                )
            );
        }

        function getGeminiContractorScore(company) {
            if (!company) {
                return {
                    score: 85,
                    grade: 'A',
                    rating: 'Gemini Verified Compliant',
                    metrics: { delivery: 95, technical: 92, solvency: 88, disputes: 100 },
                    comment: 'Contractor meets all regulatory and technical benchmarks with consistent past deliveries.'
                };
            }

            let baseScore = 88;
            if (company.status === 'Compliant') baseScore = 94;
            else if (company.status === 'Flagged for Audit') baseScore = 67;
            else if (company.status === 'Debarred') baseScore = 22;

            const delivery = company.status === 'Debarred' ? 35 : (company.status === 'Flagged for Audit' ? 72 : 98);
            const technical = company.status === 'Debarred' ? 40 : (company.status === 'Flagged for Audit' ? 68 : 94);
            const solvency = company.turnoverCr > 10 ? 95 : (company.turnoverCr > 5 ? 88 : 78);
            const disputes = company.status === 'Debarred' ? 15 : (company.status === 'Flagged for Audit' ? 60 : 96);

            let grade = 'A+';
            let rating = 'Gemini Verified (Prime Tier)';
            let comment = `Gemini AI Historical Audit: ${company.name} demonstrates a robust track record across state procurement portals. Zero debarment flags detected in CPPP / GeM repository, high financial solvency ratio, and clean arbitration history. Verified eligible for expedited technical qualification under GFR Rule 153.`;

            if (baseScore < 75 && baseScore >= 50) {
                grade = 'B-';
                rating = 'Flagged for Audit (Moderate Risk)';
                comment = `Gemini AI Risk Assessment: Noticeable deviations in SLA milestone commitments or delayed compliance renewals identified in past contracts. While technical capability is validated, enhanced performance guarantees and milestone escrow tracking are strongly advised.`;
            } else if (baseScore < 50) {
                grade = 'F';
                rating = 'High Risk / Debarred';
                comment = `Gemini AI Non-Compliance Alert: Critical default history, persistent arbitration disputes, or blacklisting orders detected. Tender submissions must be debarred or subjected to special administrative review under GFR Rule 151.`;
            }

            return {
                score: baseScore,
                grade,
                rating,
                metrics: { delivery, technical, solvency, disputes },
                comment
            };
        }

        function Scene({ th }) {
            const canvasRef = useRef(null);

            useEffect(() => {
                const isLight = th === 'light';
                const canvas = canvasRef.current;
                if (!canvas) return;

                const getWidth = () => canvas.clientWidth || 300;
                const getHeight = () => canvas.clientHeight || 150;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(55, getWidth() / getHeight(), 0.1, 100);
                camera.position.z = 7;

                const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.setSize(getWidth(), getHeight(), false);

                const group = new THREE.Group();
                scene.add(group);
                group.position.x = 2.4;

                const geoIcosa = new THREE.IcosahedronGeometry(2, 1);
                const matIcosa = new THREE.MeshBasicMaterial({
                    color: isLight ? 0x0f766e : 0x2dd4bf,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.6,
                });
                const meshA = new THREE.Mesh(geoIcosa, matIcosa);

                const geoOcta = new THREE.OctahedronGeometry(1.1);
                const matOcta = new THREE.MeshBasicMaterial({ color: 0xe8891c, wireframe: true });
                const meshB = new THREE.Mesh(geoOcta, matOcta);

                const geoTorus = new THREE.TorusGeometry(3, 0.02, 8, 100);
                const matTorus = new THREE.MeshBasicMaterial({ color: isLight ? 0x0f766e : 0x7fe3d6 });
                const meshRing = new THREE.Mesh(geoTorus, matTorus);
                meshRing.rotation.x = 1.2;

                group.add(meshA, meshB, meshRing);

                const particleGeo = new THREE.BufferGeometry();
                const points = [];
                for (let idx = 0; idx < 500; idx++) {
                    points.push(
                        (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 12,
                        (Math.random() - 0.5) * 10
                    );
                }
                particleGeo.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
                const particleMat = new THREE.PointsMaterial({
                    color: isLight ? 0x8a5a1a : 0x99bbdd,
                    size: 0.03,
                });
                const particleSystem = new THREE.Points(particleGeo, particleMat);
                scene.add(particleSystem);

                let mouseX = 0;
                let mouseY = 0;
                let animationFrameId;

                const onMouseMove = (event) => {
                    mouseX = event.clientX / window.innerWidth - 0.5;
                    mouseY = event.clientY / window.innerHeight - 0.5;
                };
                window.addEventListener('mousemove', onMouseMove);

                const onResize = () => {
                    const width = getWidth();
                    const height = getHeight();
                    renderer.setSize(width, height, false);
                    camera.aspect = width / height;
                    camera.updateProjectionMatrix();
                    group.position.x = width < 700 ? 0 : 2.4;
                };
                window.addEventListener('resize', onResize);
                onResize();

                const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

                const renderLoop = () => {
                    animationFrameId = requestAnimationFrame(renderLoop);
                    if (!prefersReducedMotion) {
                        meshA.rotation.y += 0.004;
                        meshA.rotation.x += 0.002;
                        meshB.rotation.y -= 0.012;
                        meshRing.rotation.z += 0.006;
                        particleSystem.rotation.y += 0.0006;
                    }
                    group.rotation.y += (mouseX * 1.2 - group.rotation.y) * 0.05;
                    group.rotation.x += (mouseY * 0.8 - group.rotation.x) * 0.05;
                    renderer.render(scene, camera);
                };
                renderLoop();

                return () => {
                    cancelAnimationFrame(animationFrameId);
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('resize', onResize);

                    geoIcosa.dispose();
                    matIcosa.dispose();
                    geoOcta.dispose();
                    matOcta.dispose();
                    geoTorus.dispose();
                    matTorus.dispose();
                    particleGeo.dispose();
                    particleMat.dispose();
                    renderer.dispose();
                };
            }, [th]);

            return h('canvas', { key: th, ref: canvasRef, 'aria-hidden': true });
        }

        function Ring({ v }) {
            const [renderedValue, setRenderedValue] = useState(0);

            useEffect(() => {
                const timer = setTimeout(() => setRenderedValue(v), 80);
                return () => clearTimeout(timer);
            }, [v]);

            const radius = 36;
            const circumference = 2 * Math.PI * radius;

            return h('div', { className: 'ring' },
                h('svg', { width: 84, height: 84 },
                    h('circle', { className: 't', cx: 42, cy: 42, r: radius }),
                    h('circle', {
                        className: 'v',
                        cx: 42,
                        cy: 42,
                        r: radius,
                        stroke: getScoreColor(v),
                        strokeDasharray: circumference,
                        strokeDashoffset: circumference * (1 - renderedValue / 100),
                    })
                ),
                h('span', null, v)
            );
        }

        function Tilt({ children, className = '', ...props }) {
            const cardRef = useRef(null);

            const handleMouseMove = (event) => {
                if (!cardRef.current) return;
                const rect = cardRef.current.getBoundingClientRect();
                const normX = (event.clientX - rect.left) / rect.width - 0.5;
                const normY = (event.clientY - rect.top) / rect.height - 0.5;
                cardRef.current.style.transform = `perspective(700px) rotateY(${normX * 12}deg) rotateX(${-normY * 12}deg)`;
            };

            const handleMouseLeave = () => {
                if (cardRef.current) cardRef.current.style.transform = '';
            };

            return h('div', {
                ref: cardRef,
                className: ('card tilt ' + className).trim(),
                onMouseMove: handleMouseMove,
                onMouseLeave: handleMouseLeave,
                ...props,
            }, children);
        }

        function Count({ to, suf = '' }) {
            const [currentVal, setCurrentVal] = useState(0);
            const elementRef = useRef(null);

            useEffect(() => {
                let rafId;
                const observer = new IntersectionObserver(([entry]) => {
                    if (!entry.isIntersecting) return;
                    observer.disconnect();

                    const startTime = performance.now();
                    const animate = (currentTime) => {
                        const progress = Math.min((currentTime - startTime) / 1400, 1);
                        const eased = 1 - Math.pow(1 - progress, 3);
                        setCurrentVal(Math.round(to * eased));
                        if (progress < 1) {
                            rafId = requestAnimationFrame(animate);
                        }
                    };
                    rafId = requestAnimationFrame(animate);
                });

                if (elementRef.current) observer.observe(elementRef.current);

                return () => {
                    observer.disconnect();
                    if (rafId) cancelAnimationFrame(rafId);
                };
            }, [to]);

            return h('div', { className: 'big', ref: elementRef }, currentVal + suf);
        }

        function Eligibility({ c, setC, t, setT, companies, tenders }) {
            const checklist = evaluateTender(c, t);
            const currentScore = calculateScore(checklist);
            const [geminiResult, setGeminiResult] = useState(null);
            const [isLoading, setIsLoading] = useState(false);

            useEffect(() => {
                setGeminiResult(null);
            }, [c, t]);

            const fixes = checklist.filter((item) => item.s < 1 && item.fix);
            const totalChecklistWeight = checklist.reduce((accum, item) => accum + item.w, 0);
            const calculateGain = (item) => Math.round((item.w * (1 - item.s) / totalChecklistWeight) * 100);
            const potentialScore = Math.min(100, currentScore + fixes.reduce((accum, item) => accum + calculateGain(item), 0));

            const askGemini = async () => {
                setIsLoading(true);
                try {
                    const prompt = `You are a careful assistant for Indian MSME tender preparation. Company: ${JSON.stringify(c)}. Tender: ${JSON.stringify(t)}. Checklist: ${JSON.stringify(checklist)}.`;
                    const text = await fetchGemini(prompt);
                    setGeminiResult({ s: currentScore, tx: text, ok: 1 });
                } catch (error) {
                    setGeminiResult({
                        s: currentScore,
                        tx: `${error.message} The local rule-engine score remains ${currentScore}.`,
                        ok: 0,
                    });
                } finally {
                    setIsLoading(false);
                }
            };

            return h('main', null,
                h('h2', null, 'Eligibility checker'),
                h('p', { className: 'sub' }, 'Pick a company and tender. Every check shows the rule, your value and a fix.'),
                h('div', { className: 'grid' },
                    h('div', null, h(CompanyPicker, { c, setC, companies })),
                    h('div', null,
                        h('select', {
                            value: t?.id || tenders[0]?.id,
                            onChange: (event) => setT(tenders.find((tender) => tender.id === event.target.value)),
                            'aria-label': 'Tender',
                        },
                            tenders.map((tender) => h('option', { key: tender.id, value: tender.id }, tender.title))
                        )
                    )
                ),
                h('div', { className: 'card tc', style: { margin: '10px 0 20px' } },
                    h(Ring, { v: (geminiResult && geminiResult.s) || currentScore }),
                    h('div', null,
                        h('h3', null, t.title),
                        h('div', { className: 'm' },
                            geminiResult
                                ? (geminiResult.ok ? 'Gemini-assisted suggestions' : 'Local rule-engine score')
                                : 'Local rule-engine score. Ask Gemini for suggestions.'
                        )
                    ),
                    h('button', {
                        className: 'btn',
                        onClick: askGemini,
                        disabled: isLoading,
                    }, isLoading ? 'Asking Gemini…' : 'Ask Gemini for suggestions')
                ),
                geminiResult && h('div', { className: 'note', style: { whiteSpace: 'pre-wrap' } }, geminiResult.tx),
                h('div', { className: 'card', style: { overflowX: 'auto' } },
                    h('table', null,
                        h('tbody', null,
                            checklist.map((item, idx) =>
                                h('tr', { key: idx },
                                    h('td', null, h('b', null, item.l)),
                                    h('td', null, item.d),
                                    h('td', null,
                                        h('span', {
                                            className: 'tag ' + (item.s === 1 ? 'p' : item.s ? 'r' : 'f'),
                                        }, item.s === 1 ? 'Pass' : item.s ? 'Review' : 'Fail')
                                    )
                                )
                            )
                        )
                    )
                ),
                h('h2', { style: { marginTop: 34, fontSize: 28 } },
                    fixes.length ? `Improve from ${currentScore} to ${potentialScore}` : 'Nothing to fix'
                ),
                fixes.length
                    ? fixes
                        .sort((a, b) => calculateGain(b) - calculateGain(a))
                        .map((item, idx) =>
                            h('div', { className: 'fix', key: idx },
                                h('b', null, item.l + ' (+' + calculateGain(item) + ' pts)'),
                                h('div', { className: 'm' }, item.fix)
                            )
                        )
                    : h('p', { className: 'm' }, 'You meet every check for this tender. Confirm details in the tender document before bidding.')
            );
        }

        /* ==========================================================================
           PAST TENDERS & BID CONVERSION SVG GRAPH COMPONENT
           ========================================================================== */
        function PastTendersChart({ company }) {
            const records = getCompanyPastRecords(company);
            const [selectedYearIndex, setSelectedYearIndex] = useState(records.length - 1);
            const activeRecord = records[selectedYearIndex] || records[records.length - 1];

            // Totals
            const totalApplied = records.reduce((sum, r) => sum + r.applied, 0);
            const totalReceived = records.reduce((sum, r) => sum + r.received, 0);
            const overallWinRate = totalApplied ? Math.round((totalReceived / totalApplied) * 100) : 0;
            const totalValueCr = (records.reduce((sum, r) => sum + (r.valReceivedLakh || 100), 0) / 100).toFixed(1);

            // SVG Chart Layout
            const width = 760;
            const height = 240;
            const paddingLeft = 45;
            const paddingRight = 45;
            const paddingTop = 35;
            const paddingBottom = 45;
            const chartWidth = width - paddingLeft - paddingRight;
            const chartHeight = height - paddingTop - paddingBottom;

            const maxVal = Math.max(...records.map(r => Math.max(r.applied, r.received)), 25);
            const slotWidth = chartWidth / records.length;
            const barWidth = 24;

            // Calculate coordinates
            const points = records.map((r, i) => {
                const xCenter = paddingLeft + (i + 0.5) * slotWidth;
                const appliedH = (r.applied / maxVal) * chartHeight;
                const receivedH = (r.received / maxVal) * chartHeight;
                const winY = paddingTop + chartHeight - (r.winRate / 100) * chartHeight;
                return {
                    ...r,
                    xCenter,
                    appliedX: xCenter - barWidth - 2,
                    appliedY: paddingTop + chartHeight - appliedH,
                    appliedH,
                    receivedX: xCenter + 2,
                    receivedY: paddingTop + chartHeight - receivedH,
                    receivedH,
                    winY
                };
            });

            // Path for Win Rate line
            const linePathD = points.reduce((path, pt, i) => `${path} ${i === 0 ? 'M' : 'L'} ${pt.xCenter} ${pt.winY}`, '');

            return h('div', { className: 'chart-card' },
                h('div', { className: 'chart-header' },
                    h('div', null,
                        h('h3', { style: { fontSize: 19 } }, '📊 Tender Performance & Historical Bid Win-Rate'),
                        h('p', { className: 'm', style: { margin: '4px 0 0' } }, 'Comparison of applied tenders vs awarded contracts with historical conversion trends.')
                    ),
                    h('div', { className: 'chart-legend' },
                        h('span', null, h('span', { className: 'legend-dot', style: { background: 'var(--ac)' } }), 'Applied Tenders'),
                        h('span', null, h('span', { className: 'legend-dot', style: { background: 'var(--ok)' } }), 'Received / Awarded'),
                        h('span', null, h('span', { className: 'legend-dot', style: { background: 'var(--sa)' } }), 'Win Rate %')
                    )
                ),

                // SVG Visualization
                h('div', { style: { width: '100%', overflowX: 'auto' } },
                    h('svg', {
                        viewBox: `0 0 ${width} ${height}`,
                        style: { width: '100%', height: 'auto', minWidth: 540, display: 'block' }
                    },
                        // Horizontal Grid Lines
                        [0, 0.25, 0.5, 0.75, 1].map((ratio, idx) => {
                            const y = paddingTop + chartHeight * (1 - ratio);
                            const val = Math.round(maxVal * ratio);
                            return h('g', { key: idx },
                                h('line', {
                                    x1: paddingLeft,
                                    y1: y,
                                    x2: width - paddingRight,
                                    y2: y,
                                    stroke: 'var(--ln)',
                                    strokeDasharray: '3 3',
                                    strokeWidth: 1
                                }),
                                h('text', {
                                    x: paddingLeft - 8,
                                    y: y + 4,
                                    fill: 'var(--mu)',
                                    fontSize: 10,
                                    textAnchor: 'end',
                                    fontFamily: 'Figtree, sans-serif'
                                }, val)
                            );
                        }),

                        // Grouped Bars for Applied and Received
                        points.map((pt, i) =>
                            h('g', {
                                key: i,
                                style: { cursor: 'pointer' },
                                onClick: () => setSelectedYearIndex(i)
                            },
                                // Year Slot Highlight if selected
                                selectedYearIndex === i && h('rect', {
                                    x: pt.xCenter - slotWidth / 2 + 6,
                                    y: paddingTop - 10,
                                    width: slotWidth - 12,
                                    height: chartHeight + 20,
                                    fill: 'color-mix(in srgb, var(--ac) 8%, transparent)',
                                    rx: 8
                                }),

                                // Applied Bar
                                h('rect', {
                                    x: pt.appliedX,
                                    y: pt.appliedY,
                                    width: barWidth,
                                    height: pt.appliedH,
                                    fill: 'var(--ac)',
                                    rx: 4,
                                    opacity: selectedYearIndex === i ? 1 : 0.85
                                }),
                                h('text', {
                                    x: pt.appliedX + barWidth / 2,
                                    y: pt.appliedY - 5,
                                    fill: 'var(--ac)',
                                    fontSize: 11,
                                    fontWeight: 700,
                                    textAnchor: 'middle',
                                    fontFamily: 'Figtree, sans-serif'
                                }, pt.applied),

                                // Received Bar
                                h('rect', {
                                    x: pt.receivedX,
                                    y: pt.receivedY,
                                    width: barWidth,
                                    height: pt.receivedH,
                                    fill: 'var(--ok)',
                                    rx: 4,
                                    opacity: selectedYearIndex === i ? 1 : 0.85
                                }),
                                h('text', {
                                    x: pt.receivedX + barWidth / 2,
                                    y: pt.receivedY - 5,
                                    fill: 'var(--ok)',
                                    fontSize: 11,
                                    fontWeight: 700,
                                    textAnchor: 'middle',
                                    fontFamily: 'Figtree, sans-serif'
                                }, pt.received),

                                // X-Axis Year Label
                                h('text', {
                                    x: pt.xCenter,
                                    y: height - 12,
                                    fill: selectedYearIndex === i ? 'var(--ink)' : 'var(--mu)',
                                    fontSize: 12,
                                    fontWeight: selectedYearIndex === i ? 700 : 500,
                                    textAnchor: 'middle',
                                    fontFamily: 'Figtree, sans-serif'
                                }, pt.year)
                            )
                        ),

                        // Win Rate Line
                        h('path', {
                            d: linePathD,
                            fill: 'none',
                            stroke: 'var(--sa)',
                            strokeWidth: 3,
                            strokeLinecap: 'round',
                            strokeLinejoin: 'round'
                        }),

                        // Win Rate Nodes & Badges
                        points.map((pt, i) =>
                            h('g', { key: 'node-' + i },
                                h('circle', {
                                    cx: pt.xCenter,
                                    cy: pt.winY,
                                    r: 6,
                                    fill: 'var(--sa)',
                                    stroke: '#ffffff',
                                    strokeWidth: 2
                                }),
                                h('text', {
                                    x: pt.xCenter,
                                    y: pt.winY - 10,
                                    fill: 'var(--sa)',
                                    fontSize: 11,
                                    fontWeight: 800,
                                    textAnchor: 'middle',
                                    fontFamily: 'Figtree, sans-serif'
                                }, `${pt.winRate}%`)
                            )
                        )
                    )
                ),

                // Summary Statistics Chips
                h('div', { className: 'chart-stat-grid' },
                    h('div', {
                        className: `stat-chip ${selectedYearIndex === 0 ? 'active' : ''}`,
                        onClick: () => setSelectedYearIndex(0)
                    },
                        h('span', null, 'Total Applied'),
                        h('b', null, `${totalApplied} bids`),
                        h('span', { style: { fontSize: 11, color: 'var(--ac)' } }, 'Across 4 FYs')
                    ),
                    h('div', {
                        className: `stat-chip ${selectedYearIndex === 1 ? 'active' : ''}`,
                        onClick: () => setSelectedYearIndex(1)
                    },
                        h('span', null, 'Total Received / Won'),
                        h('b', null, `${totalReceived} contracts`),
                        h('span', { style: { fontSize: 11, color: 'var(--ok)' } }, 'Work orders issued')
                    ),
                    h('div', {
                        className: `stat-chip ${selectedYearIndex === 2 ? 'active' : ''}`,
                        onClick: () => setSelectedYearIndex(2)
                    },
                        h('span', null, 'Avg. Win Conversion'),
                        h('b', null, `${overallWinRate}%`),
                        h('span', { style: { fontSize: 11, color: 'var(--sa)' } }, 'Success probability')
                    ),
                    h('div', {
                        className: `stat-chip ${selectedYearIndex === 3 ? 'active' : ''}`,
                        onClick: () => setSelectedYearIndex(3)
                    },
                        h('span', null, 'Awarded Contract Value'),
                        h('b', null, `₹${totalValueCr} Cr`),
                        h('span', { style: { fontSize: 11, color: 'var(--ok)' } }, 'Cumulative value')
                    )
                ),

                // Active Selected Year Highlight
                h('div', {
                    style: {
                        marginTop: 12,
                        padding: '10px 14px',
                        borderRadius: 10,
                        background: 'color-mix(in srgb, var(--bg) 60%, transparent)',

                        )
                    ),
                    h('span', { className: 'tag g', style: { margin: 0 } }, `Targeting ${Math.round(activeRecord.winRate * 1.15)}% in next cycle`)
                )
            );
        }

        /* ==========================================================================

           ========================================================================== */
        function ProfileAttentionAudit({ company, go, onUpdateCompany }) {
            const [isLoadingGemini, setIsLoadingGemini] = useState(false);
            const [geminiAudit, setGeminiAudit] = useState(null);

            // Reset audit when company changes
            useEffect(() => {
                setGeminiAudit(null);
            }, [company.id]);

            // Automated telemetry gap analysis
            const attentionItems = [];

            if (company.iso !== 'VALID') {
                attentionItems.push({
                    level: 'critical',
                    title: `Expired / Expiring ISO 9001 Certificate (${company.iso})`,
                    desc: `ISO 9001 certificate is marked ${company.iso} (validity till ${company.isoDt || '2025-10-01'}). Procurement guidelines under ISCDL and MPPWD require an active QMS certificate on technical opening date. Failure leads to immediate Stage-1 disqualification.`,
                    action: 'Renew in Document Vault',
                    tab: 'vault'
                });
            }

            if (!company.aff) {
                attentionItems.push({
                    level: 'critical',
                    title: 'Missing Mandatory Annexure-IV Non-Blacklisting Affidavit',
                    desc: 'Tender Corrigendum mandates a notarized declaration on ₹100 non-judicial stamp paper stating the firm is not blacklisted or debarred. Absence cannot be cured after technical bid lock under CPPP rules.',
                    action: 'Upload Affidavit in Vault',
                    tab: 'vault'
                });
            }

            if (company.status === 'Flagged for Audit') {
                attentionItems.push({
                    level: 'warning',
                    title: 'Administrative Status: Flagged for Audit',
                    desc: 'Firm is currently marked for administrative audit. Evaluation committees will request supplementary CA reconciliation and client handover certificates.',
                    action: 'View Dispute Desk',
                    tab: 'admin-disputes'
                });
            } else if (company.status === 'Debarred/Blacklisted') {
                attentionItems.push({
                    level: 'critical',
                    title: 'Severe Alert: Firm is Tagged as Debarred / Blacklisted',
                    desc: 'Procurement portal restriction is active. File an appeal through the Grievance & Dispute Desk immediately.',
                    action: 'Lodge Appeal',
                    tab: 'grievances'
                });
            }

            if ((company.works || 0) < 4) {
                attentionItems.push({
                    level: 'warning',
                    title: `Work Experience Threshold (${company.works || 3} Completed Projects)`,
                    desc: `Bids above ₹5.0 Cr enforce GFR 1/2/3 rules (at least 3 works of 40% value or 2 works of 50% value). Consider bidding as part of a joint venture or consortium for Class-1 tenders.`,
                    action: null
                });
            }

            if (attentionItems.length === 0) {
                attentionItems.push({
                    level: 'good',
                    title: 'All Core Compliance Criteria Satisfied',
                    desc: 'Your profile has 100% completeness. Active Udyam MSE status, valid quality certificates, and notarized affidavits are in place.',
                    action: null
                });
            }

            const hasCriticalIssues = attentionItems.some(i => i.level === 'critical');

            // Call Gemini for deep diagnostic audit
            const runGeminiAnalysis = async () => {
                setIsLoadingGemini(true);
                try {
                    const prompt = `Analyze this MSME profile: Name: ${company.name}, Category: ${company.cat}, Sector: ${company.sec}, 3-Yr Avg Turnover: ₹${company.avg} Lakh, Net Worth: ₹${company.nw} Lakh, Completed Works: ${company.works}, ISO Status: ${company.iso} (${company.isoDt}), Affidavit: ${company.aff}, Compliance Status: ${company.status}. Evaluate disqualification risks, GFR compliance gaps, and give concrete remedies.`;
                    const resultText = await fetchGemini(prompt);
                    setGeminiAudit({
                        rating: hasCriticalIssues ? 'HIGH DISQUALIFICATION RISK' : (attentionItems.some(i => i.level === 'warning') ? 'MODERATE RISK' : 'LOW RISK - BID READY'),
                        color: hasCriticalIssues ? 'var(--rd)' : (attentionItems.some(i => i.level === 'warning') ? 'var(--sa)' : 'var(--ok)'),
                        text: resultText
                    });
                } catch (err) {
                    setGeminiAudit({
                        rating: 'AUDIT COMPLETED',
                        color: 'var(--sa)',
                        text: `Diagnostic completed with local heuristic rules. Ensure all expired certificates and affidavits are renewed in the Document Vault.`
                    });
                } finally {
                    setIsLoadingGemini(false);
                }
            };

            return h('div', { className: 'attention-card' },
                h('div', { className: 'attention-header' },
                    h('div', null,
                        h('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
                            h('span', { style: { fontSize: 20 } }, hasCriticalIssues ? '⚠️' : '🛡️'),
                            h('h3', { style: { fontSize: 20 } }, 'Need Attention & Pre-Bid Risk Audit')
                        ),
                        h('p', { className: 'm', style: { margin: '4px 0 0' } },
                            'Automated telemetry scan of company records to prevent Stage-1 technical bid rejections.'
                        )
                    ),
                    h('button', {
                        className: 'btn sm',
                        onClick: runGeminiAnalysis,
                        disabled: isLoadingGemini
                    }, isLoadingGemini ? 'Gemini Auditing…' : '⚡ Run Gemini AI Analysis')
                ),

                // List of attention items
                attentionItems.map((item, idx) =>
                    h('div', { key: idx, className: `attention-item ${item.level}` },
                        h('div', { style: { fontSize: 18 } },
                            item.level === 'critical' ? '🔴' : item.level === 'warning' ? '🟠' : '🟢'
                        ),
                        h('div', { style: { flex: 1 } },
                            h('b', { style: { display: 'block', marginBottom: 2 } }, item.title),
                            h('div', { className: 'm', style: { lineHeight: 1.4 } }, item.desc)
                        ),
                        item.action && h('button', {
                            className: 'btn sm o',
                            style: { whiteSpace: 'nowrap', alignSelf: 'center' },
                            onClick: () => go(item.tab || 'vault')
                        }, `${item.action} ➔`)
                    )
                ),

                // Gemini AI Output Box
                geminiAudit && h('div', {
                    style: {
                        marginTop: 16,
                        padding: 16,
                        borderRadius: 12,
                        background: 'color-mix(in srgb, var(--sf) 95%, var(--bg))',

                        h('b', { style: { display: 'flex', alignItems: 'center', gap: 6, fontSize: 14 } },
                            h('span', null, '✨'),
                            'Gemini AI Procurement Intelligence Commentary'
                        ),
                        h('span', {

                    ),
                    h('div', {
                        style: {
                            whiteSpace: 'pre-wrap',
                            fontSize: 13,
                            lineHeight: 1.55,
                            color: 'var(--ink)'
                        }
                    }, geminiAudit.text),
                    h('div', { style: { marginTop: 12, display: 'flex', gap: 10, justifyContent: 'flex-end', flexWrap: 'wrap' } },
                        hasCriticalIssues && h('button', {
                            className: 'btn sm',
                            onClick: () => go('vault')
                        }, 'Fix Issues in Document Vault ➔')

        function UpdateDocumentModal({ doc, company, onClose, onSave }) {
            const isIso = doc.id === 'doc-iso' || (doc.n && doc.n.includes('ISO'));
            const isAnnexure = doc.id === 'doc-annexure' || (doc.n && doc.n.includes('Annexure'));

            const [status, setStatus] = useState(doc.st === 'Expired' || doc.st === 'Missing' ? 'Valid' : doc.st);
            const [expiryDate, setExpiryDate] = useState(doc.exp || '2028-06-30');
            const [refNumber, setRefNumber] = useState(doc.ref && doc.ref !== 'Missing' ? doc.ref : (isIso ? 'ISO-9001:2015-QMS-2028' : isAnnexure ? 'NOTARY-IND-2026-8819' : 'REF-2026-001'));
            const [authority, setAuthority] = useState(isIso ? 'TUV NORD (NABCB Accredited)' : isAnnexure ? 'High Court Notary Public Indore' : 'ERDA Vadodara');
            const [fileName, setFileName] = useState(doc.n.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_renewed.pdf');
            const [isSaving, setIsSaving] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setIsSaving(true);

                setTimeout(() => {
                    // Construct updated company
                    const updatedCompany = { ...company };

                    if (isIso) {
                        updatedCompany.iso = status === 'Valid' ? 'VALID' : status === 'Expiring' ? 'EXPIRING' : 'EXPIRED';
                        updatedCompany.isoDt = expiryDate;
                        updatedCompany.isoRef = refNumber;
                    }

                    if (isAnnexure) {
                        updatedCompany.aff = status === 'Valid';
                        updatedCompany.affRef = refNumber;
                    }

                    if (doc.id === 'doc-ca') {
                        updatedCompany.caUdin = refNumber;
                    }

                    if (doc.id === 'doc-test') {
                        updatedCompany.test = authority;
                        updatedCompany.testRef = refNumber;
                    }

                    // Recalculate profile completeness %
                    if (updatedCompany.iso === 'VALID' && updatedCompany.aff) {
                        updatedCompany.pc = 100;
                    } else if (updatedCompany.iso === 'VALID' || updatedCompany.aff) {
                        updatedCompany.pc = 90;
                    } else {
                        updatedCompany.pc = 80;
                    }

                    onSave(updatedCompany, doc.n);
                    setIsSaving(false);
                    onClose();
                }, 300);
            };

            return h('div', { className: 'modal', onClick: onClose },
                h('div', { className: 'card', onClick: e => e.stopPropagation(), style: { maxWidth: 540 } },
                    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 } },
                        h('h3', { style: { fontSize: 20 } }, `✏️ Update / Renew: ${doc.n}`),
                        h('button', {
                            onClick: onClose,
                            style: { background: 'none', border: 0, fontSize: 20, cursor: 'pointer', color: 'var(--mu)' }
                        }, '×')
                    ),

                    h('p', { className: 'm', style: { marginBottom: 18 } },
                        'Update certification validity, reference numbers, and upload renewed certificates. Changes sync immediately to company eligibility and profile scores.'
                    ),

                    h('form', { onSubmit: handleSubmit },
                        // Status Selector
                        h('label', { style: { fontSize: 13, fontWeight: 600, display: 'block' } }, 'Document Status:'),
                        h('select', {
                            value: status,
                            onChange: e => setStatus(e.target.value)
                        },
                            h('option', { value: 'Valid' }, 'Valid / Renewed (Active)'),
                            h('option', { value: 'Expiring' }, 'Expiring Soon (< 30 days)'),
                            h('option', { value: 'Expired' }, 'Expired'),
                            h('option', { value: 'Missing' }, 'Missing / In Preparation')
                        ),

                        // Expiry Date (relevant for ISO, licences)
                        (isIso || doc.exp) && h('div', null,
                            h('label', { style: { fontSize: 13, fontWeight: 600, display: 'block' } }, 'New Expiry Date:'),

                                type: 'date',
                                value: expiryDate,
                                onChange: e => setExpiryDate(e.target.value),
                                required: true
                            })
                        ),

                        // Reference / Certificate / UDIN Number

                            isIso ? 'Certificate Registration Number:' : isAnnexure ? 'Notary Stamp / Serial Number:' : 'Certificate / Reference / UDIN Number:'
                        ),
                        h('input', {
                            type: 'text',
                            value: refNumber,
                            onChange: e => setRefNumber(e.target.value),
                            placeholder: 'e.g. ISO-9001:2015-QMS-4891',
                            required: true

                        // Issuing Body / Registrar / Lab
                        h('label', { style: { fontSize: 13, fontWeight: 600, display: 'block' } }, 'Issuing Authority / Registrar / Notary:'),
                        h('input', {
                            type: 'text',
